name: Build Flutter APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./live_audio_room
      - run: flutter build apk --release
        working-directory: ./live_audio_room
      - uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: live_audio_room/build/app/outputs/flutter-apk/app-release.apk
